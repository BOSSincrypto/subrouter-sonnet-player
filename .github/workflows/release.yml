name: Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk -F'"' '{print $2}')
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | awk -F'= ' '{print $2}' | tr -d ' ')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version_name }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build release APK
        if: steps.check_tag.outputs.exists == 'false'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        if: steps.check_tag.outputs.exists == 'false'
        id: sign_apk
        run: |
          # For debug signing (development)
          # In production, use proper keystore with secrets
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi

          # Create output filename
          OUTPUT_NAME="SonnetPlayer-v${{ steps.version.outputs.version_name }}.apk"
          OUTPUT_PATH="app/build/outputs/apk/release/$OUTPUT_NAME"

          # Rename the APK
          mv "$APK_PATH" "$OUTPUT_PATH"

          echo "apk_path=$OUTPUT_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$OUTPUT_NAME" >> $GITHUB_OUTPUT

      - name: Generate changelog
        if: steps.check_tag.outputs.exists == 'false'
        id: changelog
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            # First release - get all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since last tag
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Create changelog
          CHANGELOG="## What's Changed

          $COMMITS

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...v${{ steps.version.outputs.version_name }}"

          # Handle first release
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG="## What's New

          Initial release of SonnetPlayer

          $COMMITS"
          fi

          # Save to file for multiline output
          echo "$CHANGELOG" > changelog.txt

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: SonnetPlayer v${{ steps.version.outputs.version_name }}
          body_path: changelog.txt
          files: ${{ steps.sign_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload APK artifact
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-v${{ steps.version.outputs.version_name }}
          path: ${{ steps.sign_apk.outputs.apk_path }}
          retention-days: 90

      - name: Release already exists
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "::notice::Release v${{ steps.version.outputs.version_name }} already exists. Skipping release creation."
          echo "To create a new release, update the version in app/build.gradle.kts"
